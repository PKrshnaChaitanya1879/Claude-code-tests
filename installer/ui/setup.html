<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grvty Setup</title>
<style>
@font-face { font-family: "Nunito"; font-weight: 800; src: url(nunito-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 500; src: url(geist-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 600; src: url(geist-latin-600-normal.woff2) format("woff2"); }
:root {
  --ink: #2A1622; --ink-2: #6E5262; --ink-3: #A98C9B; --accent: #D23A66; --accent-ink: #FFF7FA;
  --glass: rgba(255,255,255,.42); --glass-strong: rgba(255,255,255,.62); --edge: rgba(255,255,255,.8); --edge-2: rgba(255,255,255,.2);
  --shadow: rgba(120,40,75,.3); --track: rgba(110,60,85,.14);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
body { font: 500 14px/1.5 "Geist", "Segoe UI Variable", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
  background: radial-gradient(520px 420px at 15% 8%, #f6bfd2, transparent 62%), radial-gradient(520px 460px at 100% 100%, #d7c4f3, transparent 60%), radial-gradient(400px 300px at 90% 10%, #ffe1cf, transparent 60%), #F3E3EA; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.blob { position: fixed; border-radius: 50%; filter: blur(40px); opacity: .55; pointer-events: none; }
.b1 { width: 260px; height: 260px; background: #f39bb9; left: -60px; top: 300px; animation: drift 16s ease-in-out infinite alternate; }
.b2 { width: 220px; height: 220px; background: #c7b2f2; right: -50px; top: 40px; animation: drift 19s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(40px, -30px) scale(1.1); } }

.card { position: absolute; inset: 14px; border-radius: 30px; background: var(--glass);
  box-shadow: inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--edge-2), 0 30px 60px -30px var(--shadow);
  display: grid; grid-template-rows: auto 1fr auto; padding: 18px 28px 28px; }
.card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(140deg, var(--edge), transparent 40%, transparent 60%, var(--edge-2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; }
.chrome { display: flex; justify-content: flex-end; gap: 6px; }
.chrome button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--glass); box-shadow: inset 0 1px 0 var(--edge); transition: background .2s, color .2s; }
.chrome button:hover { background: var(--glass-strong); color: var(--ink); }
.chrome svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

.body { display: grid; justify-items: center; align-content: center; text-align: center; gap: 6px; }
.orbit { width: 210px; height: 210px; overflow: visible; margin-bottom: 6px; }
.orbit .ring { fill: none; stroke: var(--track); stroke-width: 6; }
.orbit .prog { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 105px 105px; stroke-dasharray: 534; stroke-dashoffset: 534; transition: stroke-dashoffset .4s ease; }
.orbit .dash { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 2 7; opacity: .7; }
.orbit .planet { fill: var(--accent); filter: drop-shadow(0 10px 16px rgba(160,30,70,.35)); transform-origin: 105px 105px; transition: transform .6s cubic-bezier(.2,.9,.3,1.5); }
.orbit .shine { fill: rgba(255,255,255,.45); }
.orbit .moon-arm { transform-origin: 105px 105px; animation: spin 10s linear infinite; }
.orbit .moon { fill: var(--ink); }
.working .orbit .moon-arm { animation-duration: 1.6s; }
.done .orbit .moon-arm { animation: settle 1.2s cubic-bezier(.2,.9,.3,1.2) forwards; }
.done .orbit .planet { transform: scale(1.06); }
.orbit .check { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset .6s .3s ease; }
.done .orbit .check { stroke-dashoffset: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes settle { to { transform: rotate(405deg); } }

h1 { margin: 0; font: 800 34px/1.05 "Nunito", "Geist", sans-serif; letter-spacing: -.04em; }
.sub { margin: 0; color: var(--ink-2); max-width: 34ch; min-height: 3em; }
.status { font-size: 13px; color: var(--ink-2); min-height: 20px; font-variant-numeric: tabular-nums; }

.foot { display: grid; gap: 10px; justify-items: center; }
.btn { position: relative; overflow: hidden; width: 100%; max-width: 320px; padding: 15px 24px; border-radius: 999px; font-weight: 600; font-size: 15.5px;
  background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 6px rgba(0,0,0,.12), 0 14px 30px -12px var(--accent);
  transition: transform .2s cubic-bezier(.2,.9,.3,1.4), opacity .3s; }
.btn::after { content: ""; position: absolute; inset: 0 0 50% 0; border-radius: 999px 999px 40% 40%; background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,0)); }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.ghost { background: var(--glass); color: var(--ink); box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--edge-2); }
.fine { font-size: 12px; color: var(--ink-3); }
.fade { animation: fade .5s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
.sparks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.sparks i { position: absolute; top: -12px; width: 8px; height: 8px; border-radius: 50%; animation: fall 1.6s cubic-bezier(.3,.6,.4,1) forwards; }
@keyframes fall { to { transform: translateY(560px) rotate(200deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="card" id="card">
  <div class="chrome">
    <button id="min" aria-label="Minimise"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button id="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
  <div class="body">
    <svg class="orbit" viewBox="0 0 210 210" aria-hidden="true">
      <circle class="dash" cx="105" cy="105" r="98"/>
      <circle class="ring" cx="105" cy="105" r="85"/>
      <circle class="prog" id="prog" cx="105" cy="105" r="85"/>
      <circle class="planet" cx="105" cy="105" r="44"/>
      <ellipse class="shine" cx="92" cy="86" rx="16" ry="10" transform="rotate(-25 92 86)"/>
      <path class="check" d="M86 106l13 13 25-27"/>
      <g class="moon-arm"><circle class="moon" cx="105" cy="13" r="10"/></g>
    </svg>
    <h1 id="title">Grvty</h1>
    <p class="sub" id="sub">Grade your photos by describing a look. Everything stays on this laptop.</p>
    <div class="status" id="status"></div>
  </div>
  <div class="foot">
    <button class="btn" id="go">Install</button>
    <div class="fine" id="fine">Installs just for you. No admin password needed.</div>
  </div>
</div>
<div class="sparks" id="sparks"></div>
<script>
const $ = (s) => document.querySelector(s);
const api = () => window.pywebview.api;
let mode = "install", phase = "idle";
const RING = 534;
function setProgress(p) { $("#prog").style.strokeDashoffset = RING * (1 - p); }
function sparks() {
  const box = $("#sparks"), cols = ["#D23A66", "#F3A9BE", "#2A1622", "#C7B2F2", "#FFC9A8"];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("i");
    s.style.left = Math.random() * 100 + "%"; s.style.background = cols[i % cols.length];
    s.style.animationDelay = Math.random() * .5 + "s"; s.style.width = s.style.height = 5 + Math.random() * 6 + "px";
    box.appendChild(s);
  }
  setTimeout(() => (box.innerHTML = ""), 2500);
}
function view(t, sub, btn, fine) {
  for (const [id, v] of [["#title", t], ["#sub", sub], ["#go", btn], ["#fine", fine]]) {
    const el = $(id); if (v === null) continue; el.textContent = v; el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
  }
}
async function poll() {
  const st = await api().status();
  setProgress(st.progress);
  $("#status").textContent = st.phase === "working" ? `${st.message} · ${Math.round(st.progress * 100)}%` : "";
  if (st.phase === "working") return setTimeout(poll, 150);
  if (st.phase === "error") {
    $("#card").classList.remove("working");
    view("Something went wrong", st.error, "Try again", "Close other copies of Grvty and try again.");
    $("#go").disabled = false; phase = "idle"; return;
  }
  if (st.phase === "done") {
    phase = "done"; $("#card").classList.remove("working"); $("#card").classList.add("done"); sparks();
    if (mode === "uninstall") view("All gone", "Grvty has been removed. Your saved looks and Lightroom presets are still there.", "Close", "");
    else view("Grvty is ready", "It's on your desktop and in the Start menu.", "Open Grvty", "Drop in some photos and describe a look.");
    $("#go").disabled = false;
  }
}
async function go() {
  if (phase === "done") { mode === "uninstall" ? api().close() : api().launch(); return; }
  if (phase === "working") return;
  phase = "working"; $("#go").disabled = true; $("#card").classList.add("working");
  view(mode === "uninstall" ? "Removing…" : "Installing…", mode === "uninstall" ? "Just a moment." : "This takes about a minute. The moon will tell you how it's going.", mode === "uninstall" ? "Removing…" : "Installing…", null);
  mode === "uninstall" ? await api().uninstall() : await api().install();
  poll();
}
window.addEventListener("pywebviewready", async () => {
  const info = await api().info();
  mode = info.mode;
  if (mode === "uninstall") view("Remove Grvty?", "This removes the app. Your saved looks and Lightroom presets stay.", "Remove Grvty", `Version ${info.version}`);
  else if (info.installed) view("Update Grvty", "A newer Grvty is ready. Your looks and settings stay as they are.", "Update", `Version ${info.version} · about ${info.size_mb} MB`);
  else $("#fine").textContent = `Installs just for you. No admin password needed. About ${info.size_mb} MB.`;
});
$("#go").addEventListener("click", go);
$("#x").addEventListener("click", () => { if (phase !== "working") api().close(); });
$("#min").addEventListener("click", () => api().minimize());
document.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); if (e.key === "Escape" && phase !== "working") api().close(); });
</script>
</body>
</html>
